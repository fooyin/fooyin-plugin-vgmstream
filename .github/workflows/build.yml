name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  contents: write # needed for release upload

jobs:
  build:
    name: Build plugin with fooyin SDK (Linux)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    env:
      FOOYIN_SDK_RELEASE: nightly
      FOOYIN_PREFIX: ${{ github.workspace }}/fooyin-install

    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential  \
            git \
            cmake \
            ninja-build \
            pkg-config \
            ca-certificates \
            xz-utils \
            qt6-base-dev \
            libqt6svg6 \
            libqt6sql6-sqlite \
            libavcodec-dev \
            libavfilter9 \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libicu74 \
            libtag1v5 \
            libarchive13t64 \
            libmpg123-dev \
            libvorbis-dev \
            libspeex-dev \
            zlib1g-dev \
            libqcoro6core0t64 \
            libqcoro6network0t64

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download fooyin SDK
        uses: robinraju/release-downloader@v1
        with:
          repository: fooyin/fooyin
          tag: ${{ env.FOOYIN_SDK_RELEASE }}
          fileName: fooyin-sdk-*-linux-x64-qt6.4.tar.xz
          out-file-path: fooyin-sdk

      - name: Extract fooyin SDK
        shell: bash
        run: |
          set -euo pipefail
          archives=(fooyin-sdk/*.tar.xz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one Linux Qt 6.4 SDK" >&2
            exit 1
          fi
          mkdir -p "$FOOYIN_PREFIX"
          tar -xJf "${archives[0]}" -C "$FOOYIN_PREFIX" --strip-components=1
          cat "$FOOYIN_PREFIX/sdk-manifest.json"

      - name: Configure plugin
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$FOOYIN_PREFIX" \
            -DBUILD_PLUGIN_BUNDLE=ON

      - name: Build plugin
        run: cmake --build build

      - name: Package plugin bundle
        run: cmake --build build --target package_plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-vgmstream-linux
          path: build/fooyin-vgmstream-linux-x64.fyplugin
          if-no-files-found: error

  build-windows:
    name: Build plugin with fooyin SDK (Windows)
    runs-on: windows-latest

    env:
      FOOYIN_SDK_RELEASE: nightly
      FOOYIN_PREFIX: ${{ github.workspace }}/fooyin-install
      QT_VERSION: '6.12.0'

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download fooyin SDK
        uses: robinraju/release-downloader@v1
        with:
          repository: fooyin/fooyin
          tag: ${{ env.FOOYIN_SDK_RELEASE }}
          fileName: fooyin-sdk-*-windows-x64-msvc-qt6.12.zip
          out-file-path: fooyin-sdk-download
          extract: true
          extract-path: fooyin-sdk

      - name: Set up fooyin SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefixes = @(Get-ChildItem fooyin-sdk -Directory)
          if ($prefixes.Count -ne 1) {
            throw 'Expected one SDK installation directory'
          }
          Move-Item -LiteralPath $prefixes[0].FullName -Destination $env:FOOYIN_PREFIX
          Get-Content "$env:FOOYIN_PREFIX/sdk-manifest.json"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Support the Windows x64 repository layout used by Qt 6.11 and later.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          archives: qtbase qtsvg qttools
          cache: true
          arch: win64_msvc2022_64
          install-deps: 'true'

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64

      - name: Configure plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:FOOYIN_PREFIX" `
            -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DBUILD_PLUGIN_BUNDLE=ON

      - name: Build plugin
        run: cmake --build build

      - name: Package plugin bundle
        run: cmake --build build --target package_plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-vgmstream-windows
          path: build/fooyin-vgmstream-windows-x64.fyplugin
          if-no-files-found: error

  bundle:
    name: Package all platforms
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream-linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream-windows
          path: ./artifacts

      - name: Package combined plugin bundle
        run: |
          cmake -E make_directory bundle
          cd bundle
          cmake -E tar xf ../artifacts/fooyin-vgmstream-linux-x64.fyplugin
          cmake -E tar xf ../artifacts/fooyin-vgmstream-windows-x64.fyplugin
          cmake -E tar cf ../fooyin-vgmstream.fyplugin --format=zip linux-x64 windows-x64 licenses COPYING README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-vgmstream-all
          path: fooyin-vgmstream.fyplugin
          if-no-files-found: error

  attach:
    name: Attach to release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [bundle]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream-linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream-windows
          path: ./artifacts

      - name: Download combined artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream-all
          path: ./artifacts

      - name: Upload Linux artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-vgmstream-linux-x64.fyplugin
          overwrite: true

      - name: Upload Windows artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-vgmstream-windows-x64.fyplugin
          overwrite: true

      - name: Upload combined artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-vgmstream.fyplugin
          overwrite: true
