name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  contents: write # needed for release upload

jobs:
  build:
    name: Build fooyin and plugin
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    env:
      FOOYIN_REF: master
      FOOYIN_PREFIX: ${{ github.workspace }}/fooyin-install
      QT_VERSION: 6.4.3

    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libasound2-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libicu-dev \
            libtag1-dev \
            zlib1g-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtsvg qttools
          cache: true
          install-deps: 'true'

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout fooyin
        uses: actions/checkout@v7
        with:
          repository: fooyin/fooyin
          ref: ${{ env.FOOYIN_REF }}
          path: fooyin
          submodules: recursive

      - name: Configure fooyin
        run: |
          cmake -S fooyin -B fooyin-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$FOOYIN_PREFIX" \
            -DBUILD_PCH=ON \
            -DBUILD_TRANSLATIONS=OFF \
            -DINSTALL_HEADERS=ON \
            -DPLUGIN_SELECTION=none

      - name: Build fooyin
        run: cmake --build fooyin-build

      - name: Install fooyin
        run: cmake --install fooyin-build

      - name: Configure plugin
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$FOOYIN_PREFIX"

      - name: Build plugin
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-vgmstream
          path: build/fyplugin_vgmstream.so
          if-no-files-found: error

  attach:
    name: Attach to release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-vgmstream
          path: ./artifacts

      - name: Upload artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fyplugin_vgmstream.so
          overwrite: true
